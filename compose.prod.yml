services:
  app:
    image: ${DOCKERHUB_IMAGE}:${IMAGE_TAG:-latest}
    container_name: python_app
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

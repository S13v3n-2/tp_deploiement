name: CI/CD Pipeline - Test, Build & Deploy sur AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # Pour l'authentification OIDC avec votre rôle
  contents: read

env:
  AWS_REGION: eu-west-3
  ROLE_TO_ASSUME: arn:aws:iam::063584552033:role/role_github
  ECR_REPOSITORY: mon-app-docker

jobs:
  # Job 1 : Tests unitaires
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit

  # Job 2 : Tests E2E
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Attente disponibilité
        run: |
          timeout 60 bash -c 'until curl -f http://localhost/health; do sleep 2; done'
      - run: pytest tests/e2e
      - if: always()
        run: docker compose down

  # Job 3 : Build & Push sur AWS ECR
  build-and-push:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authentification AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}

      - name: Connexion à Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build et Tag de l'image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # Job 4 : Déploiement automatique du conteneur
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}

      - name: Déclencher le déploiement App Runner
        run: |
          aws apprunner start-deployment \
            --service-arn <ARN_DE_VOTRE_SERVICE_APP_RUNNER>
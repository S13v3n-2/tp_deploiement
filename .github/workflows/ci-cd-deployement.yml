name: CI/CD - Deployement

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for application to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthcheck; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          exit 1

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8080
        run: pytest tests/e2e -v

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down

  build-and-push:
    name: Build & Push Docker Hub
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Déploiement vers EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.DEPLOY_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/private.pem
          chmod 600 ~/.ssh/private.pem
          echo "ssh-keyscan -H $SSH_HOST > ~/.ssh/known_hosts"
          ssh-keyscan -H $SSH_HOST > ~/.ssh/known_hosts

      - name: Déployer le conteneur via SSH
        env:
          CONTAINER_NAME: api-tp-cicd
        run: |
          ssh -i ~/.ssh/private.pem -o StrictHostKeyChecking=accept-new ubuntu@$SSH_HOST << EOF
            IMAGE_TARGET="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            
            echo "Arrêt et nettoyage de l'ancien conteneur..."
            sudo docker stop ${{ env.CONTAINER_NAME }} || true
            sudo docker rm ${{ env.CONTAINER_NAME }} || true
            
            echo "Récupération de la nouvelle image..."
            sudo docker pull \$IMAGE_TARGET
            
            echo "Démarrage du conteneur..."
            # Mapping 8080:8080 (ou 8080:3000 selon le port interne de votre application)
            sudo docker run --name ${{ env.CONTAINER_NAME }} -d --restart unless-stopped -p 8080:8080 \$IMAGE_TARGET
            
            sudo docker image prune -f
          EOF

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test healthcheck on deployed app
        run: sleep 3 && curl http://$DEPLOY_IP:3000/health
        env:
          DEPLOY_IP: ${{ vars.DEPLOY_IP }}